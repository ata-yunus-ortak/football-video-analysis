name: tests
on: [push, pull_request, workflow_dispatch]
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -S -m unittest discover -s tests -v
      - run: python -S -m football_video_analysis demo --out outputs/demo
      - run: python -S -m football_video_analysis analyze --tracks examples/synthetic_tracks.json --config examples/synthetic_config.json --out outputs/replay
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-video.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m football_video_analysis demo --render-video --out outputs/demo
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo
          path: outputs/demo/
